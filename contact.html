<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NNN | Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: powderblue;">

<header>
    <h1>Contact Us</h1>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="products.html">Products and Services</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
</header>

<main>
    <section>
        <h2>Send Us a Message</h2>
        <form name="contact" id="contact" method="post" action="/submit" autocomplete="on">
            <fieldset>
                <legend>Contact us</legend>

                <label for="name">Full name</label>
                <input type="text" id="name" name="name" required maxlength="60">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="topic">Topic</label>
                <select id="topic" name="topic">
                    <option value="support">Support</option>
                    <option value="sales">Sales</option>
                    <option value="general">General</option>
                </select>

                <input type="submit" value="Send">
            </fieldset>
        </form>
    </section>

    <section>
        <h2>Other Ways to Reach Us</h2>
        <p><a href="mailto:info@nnn.co.za?subject=Enquiry%20from%20web%20site">Email Us</a></p>
        <p><a href="info.pdf" download>Download our media kit</a></p>
    </section>
</main>

<footer>
    <p>&copy; 2026 Global Digital Network (NNN)</p>
</footer>

</body>
</html>
